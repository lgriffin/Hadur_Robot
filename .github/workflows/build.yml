name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests, architecture rules, replay and requirement traceability
        run: mvn -B verify
      - name: Requirement coverage
        if: always()
        run: cat hadur-core/target/requirements-coverage.md >> "$GITHUB_STEP_SUMMARY" || true
