name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests, architecture rules, replay and requirement traceability
        run: mvn -B verify
      - name: Bench tool tests (every test_*.py)
        run: |
          python3 -m pip install --quiet numpy matplotlib
          (cd hadur-bench && python3 -m unittest discover -s . -p "test_*.py")
          (cd hadur-bench/tools && python3 -m unittest discover -s . -p "test_*.py")
          (cd data/tools && python3 -m unittest discover -s . -p "test_*.py")
      - name: Requirement coverage
        if: always()
        run: cat hadur-core/target/requirements-coverage.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Coverage summary
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv, glob, os
          print("\n## Coverage (JaCoCo)\n\n| Module | Lines | Branches |\n|---|---|---|")
          for path in sorted(glob.glob("*/target/site/jacoco/jacoco.csv")):
              rows = list(csv.DictReader(open(path)))
              def pct(kind):
                  m = sum(int(r[kind + "_MISSED"]) for r in rows)
                  c = sum(int(r[kind + "_COVERED"]) for r in rows)
                  return "%.1f%%" % (100 * c / (m + c)) if m + c else "-"
              print("| %s | %s | %s |" % (path.split(os.sep)[0], pct("LINE"), pct("BRANCH")))
          PY
