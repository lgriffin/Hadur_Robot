name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests, architecture rules, replay and requirement traceability
        run: mvn -B verify
      - name: Bench queue runner tests
        run: python3 -m pip install --quiet numpy && python3 -m unittest discover -s hadur-bench -p "test_benchqueue.py" && python3 -m unittest discover -s hadur-bench -p "test_benchwatch.py" && python3 -m unittest discover -s hadur-bench -p "test_hostprofile.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_host_check.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_top5_tools.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_ladder.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_table_v1.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_shield_s2.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_modes_v2.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_shield_s3.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_saor_gates.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_saor_fields.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_saor_arms.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_saor_live.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_sanaro.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_distill.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_melee_s0.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_melee_exposure.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_factor_picks.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_third.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_twin_read.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_qualify_pc.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_fence.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_twin_pick.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_twin_table.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_kitlab.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_gun_oracle.py" && python3 -m unittest discover -s hadur-bench/tools -p "test_team_gun.py"
      - name: Bench publish tests
        run: python3 test_publish_run.py
        working-directory: data/tools
      - name: Bench analysis and LiteRumble tests
        run: python3 test_analyse.py && python3 test_literumble.py && python3 test_live_client.py && python3 test_peer_gap.py && python3 test_midrange_gap.py && python3 test_melee_firepower.py && python3 test_census_classify.py && python3 test_hit_forensics.py && python3 test_move_lab.py && python3 test_aes_rank.py && python3 test_census_joint.py && python3 test_score_split.py && python3 test_multiarm.py && python3 test_melee_gap.py
        working-directory: data/tools
      - name: Requirement coverage
        if: always()
        run: cat hadur-core/target/requirements-coverage.md >> "$GITHUB_STEP_SUMMARY" || true
