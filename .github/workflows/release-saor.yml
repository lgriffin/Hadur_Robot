name: release-saor

# Saor (docs/saor.md) ships on its own tags, saor-v0.1 and on, so its releases never touch
# Hadur's v* tags or their workflow. Run by hand with a version: it builds and tests the repo,
# checks the Saor jar carries that version and fits MicroMelee's 749 bytes (the saor build
# fails above it, SAOR-11), and publishes a release with the jar. The release asset URL is a
# direct download, which is what the MeleeRumble participants list needs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Saor version to release, e.g. 0.1 (tags saor-v0.1)'
        required: true

env:
  TAG: saor-v${{ inputs.version }}
  VERSION: ${{ inputs.version }}

permissions:
  contents: write

concurrency:
  group: release-saor-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Check the jar name and version match the tag
        run: |
          jar="saor/target/hadur117.micro.Saor_${VERSION}.jar"
          test -f "$jar" || { echo "missing $jar"; ls saor/target/*.jar; exit 1; }
          unzip -p "$jar" hadur117/micro/Saor.properties | grep -qx "robot.version=${VERSION}" \
            || { echo "robot.version in $jar is not ${VERSION}"; exit 1; }
          unzip -l "$jar" | grep -q "hadur117/micro/SaorLab" \
            && { echo "$jar carries the bench adapter"; exit 1; }
          echo "JAR=$jar" >> "$GITHUB_ENV"
      - name: Check an existing tag points at this commit
        run: |
          target=$(git ls-remote --tags origin "refs/tags/${TAG}*" | awk -v t="refs/tags/${TAG}" \
            '$2 == t "^{}" { peeled = $1 } $2 == t { plain = $1 } END { print (peeled ? peeled : plain) }')
          if [ -n "$target" ] && [ "$target" != "$GITHUB_SHA" ]; then
            echo "${TAG} already points at ${target}, not ${GITHUB_SHA}; run the workflow on that commit."
            exit 1
          fi
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Saor ${{ inputs.version }}
          files: ${{ env.JAR }}
          body_path: docs/releases/${{ env.TAG }}.md
          make_latest: 'false'
