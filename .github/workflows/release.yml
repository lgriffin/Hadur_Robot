name: release

# Pushing a tag like v2.1, or running this workflow by hand with a version, builds the
# robot, checks the jar matches the version, and publishes a GitHub release (tagging the
# commit if needed) with the jar attached, and the team jar beside it when the build makes
# one (A5). The release asset URL is a direct download, which is what RoboRumble
# participant lists need.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.1 (tags v2.1)'
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

# One release run per tag at a time, so the tag check below can't race another run.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Check the jar name and version match the tag
        run: |
          version="${TAG#v}"
          jar="hadur-robot/target/hadur2.Hadur_${version}.jar"
          test -f "$jar" || { echo "missing $jar"; exit 1; }
          unzip -p "$jar" hadur2/Hadur.properties | grep -qx "robot.version=${version}" \
            || { echo "robot.version in $jar is not ${version}"; exit 1; }
          # A5: a source with a team file builds the team jar, which ships beside the solo
          # jar at the same version; a missing one fails the release rather than dropping it.
          team="hadur-robot/target/hadur2.HadurTeam_${version}.jar"
          if [ -f hadur-robot/src/team/HadurTeam.team ] && [ ! -f "$team" ]; then
            echo "missing $team"; ls hadur-robot/target/hadur2.HadurTeam_*.jar 2>/dev/null; exit 1
          fi
          if [ -f "$team" ]; then
            unzip -p "$team" hadur2/HadurTeam.team | grep -qx "team.version=${version}" \
              || { echo "team.version in $team is not ${version}"; exit 1; }
            unzip -p "$team" hadur2/HadurTeam.team | grep -q "^team.members=hadur2.Hadur ${version}," \
              || { echo "the members in $team are not hadur2.Hadur ${version}"; exit 1; }
            unzip -p "$team" hadur2/Hadur.properties | grep -qx "robot.version=${version}" \
              || { echo "robot.version in $team is not ${version}"; exit 1; }
          else
            team=""
          fi
          { echo "FILES<<EOF"; echo "$jar"; [ -z "$team" ] || echo "$team"; echo "EOF"; } >> "$GITHUB_ENV"
      - name: Check an existing tag points at this commit
        run: |
          # A manual run for a version that is already tagged must build that tag's commit,
          # or the release would carry a jar from different source. Annotated tags list
          # their commit on the ^{} line.
          target=$(git ls-remote --tags origin "refs/tags/${TAG}*" | awk -v t="refs/tags/${TAG}" \
            '$2 == t "^{}" { peeled = $1 } $2 == t { plain = $1 } END { print (peeled ? peeled : plain) }')
          if [ -n "$target" ] && [ "$target" != "$GITHUB_SHA" ]; then
            echo "${TAG} already points at ${target}, not ${GITHUB_SHA}; run the workflow on that commit."
            exit 1
          fi
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Hadur ${{ env.TAG }}
          files: ${{ env.FILES }}
          body_path: docs/releases/${{ env.TAG }}.md
