name: release

# Pushing a tag like v2.1, or running this workflow by hand with a version, builds the
# robot, checks the jar matches the version, and publishes a GitHub release (tagging the
# commit if needed) with the jar attached. The release asset URL is a direct download,
# which is what RoboRumble participant lists need.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.1 (tags v2.1)'
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

# One release run per tag at a time, so the tag check below can't race another run.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Check the jar name and version match the tag
        run: |
          version="${TAG#v}"
          jar="hadur-robot/target/hadur2.Hadur_${version}.jar"
          test -f "$jar" || { echo "missing $jar"; exit 1; }
          unzip -p "$jar" hadur2/Hadur.properties | grep -qx "robot.version=${version}" \
            || { echo "robot.version in $jar is not ${version}"; exit 1; }
          echo "JAR=$jar" >> "$GITHUB_ENV"
      - name: Check an existing tag points at this commit
        run: |
          # A manual run for a version that is already tagged must build that tag's commit,
          # or the release would carry a jar from different source. Annotated tags list
          # their commit on the ^{} line.
          target=$(git ls-remote --tags origin "refs/tags/${TAG}*" | awk -v t="refs/tags/${TAG}" \
            '$2 == t "^{}" { peeled = $1 } $2 == t { plain = $1 } END { print (peeled ? peeled : plain) }')
          if [ -n "$target" ] && [ "$target" != "$GITHUB_SHA" ]; then
            echo "${TAG} already points at ${target}, not ${GITHUB_SHA}; run the workflow on that commit."
            exit 1
          fi
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Hadur ${{ env.TAG }}
          files: ${{ env.JAR }}
          body_path: docs/releases/${{ env.TAG }}.md
