name: pages

# Rebuilds the docs site (Javadoc, EARS requirement map, design docs) from master and
# commits it to the gh-pages branch, which GitHub Pages serves. The same script publishes
# by hand when Actions is unavailable: site/build.sh --publish.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and publish the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          site/build.sh --publish
